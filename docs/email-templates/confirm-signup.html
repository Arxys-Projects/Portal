<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arxys Partner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:0; background-color:#f6f7f9; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f6f7f9; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px; background-color:#ffffff; border:1px solid #d1d2d4; border-radius:8px;">
          <tr>
            <td style="padding:32px 32px 0 32px; text-align:center;">
              <img src="https://portal.arxys.com/email/arxys-logo.png" alt="Arxys" width="140" style="display:inline-block; height:auto;">
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px 32px;">
              <h1 style="margin:0 0 16px 0; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:22px; font-weight:700; color:#1a1a1a; line-height:1.4;">
                Confirm your account
              </h1>
              <p style="margin:0 0 16px 0; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:400; color:#333333; line-height:1.6;">
                Welcome to the Arxys Partner Portal. Click below to confirm your account and finish signing up.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 24px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#fbb040; border-radius:6px;">
                    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/dashboard" style="display:inline-block; padding:12px 24px; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#1a1a1a; text-decoration:none;">
                      Confirm account
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px; border-top:1px solid #d1d2d4;">
              <p style="margin:24px 0 8px 0; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:400; color:#888888; line-height:1.6;">
                If you didn't expect this email you can ignore it. Questions? Reply to this message &mdash; replies go to <a href="mailto:sales@arxys.com" style="color:#fbb040; text-decoration:none;">sales@arxys.com</a>.
              </p>
              <p style="margin:0; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:400; color:#888888; line-height:1.6;">
                Arxys &middot; San Diego, CA &middot; <a href="https://www.arxys.com" style="color:#888888; text-decoration:underline;">arxys.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
